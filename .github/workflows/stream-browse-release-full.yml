name: Stream & Browse Full Platform Release

on: [workflow_dispatch]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"
  RELEASE_TAG: v1.18.2-baytbeam.1

jobs:
  verify:
    name: Verify Stream & Browse core
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install rustfmt for the repository toolchain
        run: rustup component add rustfmt --toolchain "$(rustup show active-toolchain | awk '{print $1}')"

      - name: Check formatting of changed Rust files
        run: |
          rustfmt --edition 2021 --check packages/core/src/http/server/stream.rs
          rustfmt --edition 2021 --check packages/core/tests/stream_browse.rs
          rustfmt --edition 2021 --check packages/core/src/http/server/home_hub.rs
          rustfmt --edition 2021 --check packages/core/tests/home_hub.rs
          rustfmt --edition 2021 --check packages/localsend_isolates/rust/src/api/server.rs

      - name: Run Home Hub integration tests
        run: cargo test --manifest-path packages/core/Cargo.toml --features http --test home_hub -- --nocapture

      - name: Run Stream & Browse integration tests
        run: cargo test --manifest-path packages/core/Cargo.toml --features http --test stream_browse -- --nocapture

      - name: Run Stream & Browse unit tests
        run: cargo test --manifest-path packages/core/Cargo.toml --features http --lib stream -- --nocapture

      - name: Check core HTTP build
        run: cargo check --manifest-path packages/core/Cargo.toml --features http

      - name: Set up Flutter for Home Hub analysis
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Analyze Flutter Home Hub changes
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

  build_android:
    name: Build Android APKs
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure BaytBeam release signing
        working-directory: app/android
        env:
          BAYTBEAM_ANDROID_KEYSTORE_BASE64: ${{ secrets.BAYTBEAM_ANDROID_KEYSTORE_BASE64 }}
          BAYTBEAM_ANDROID_STORE_PASSWORD: ${{ secrets.BAYTBEAM_ANDROID_STORE_PASSWORD }}
          BAYTBEAM_ANDROID_KEY_PASSWORD: ${{ secrets.BAYTBEAM_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$BAYTBEAM_ANDROID_KEYSTORE_BASE64" ] && [ -n "$BAYTBEAM_ANDROID_STORE_PASSWORD" ] && [ -n "$BAYTBEAM_ANDROID_KEY_PASSWORD" ]; then
            echo "$BAYTBEAM_ANDROID_KEYSTORE_BASE64" | base64 --decode > baytbeam-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=baytbeam\nstoreFile=../baytbeam-release.jks\n' "$BAYTBEAM_ANDROID_STORE_PASSWORD" "$BAYTBEAM_ANDROID_KEY_PASSWORD" > key.properties
            echo "Using the maintainer-controlled BaytBeam Android keystore."
          else
            keytool -genkeypair -noprompt -v -keystore baytbeam-release.jks -storepass baytbeam-ci-only -alias baytbeam -keypass baytbeam-ci-only -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=BaytBeam, OU=BaytBeam Project, O=BaytBeam Project, L=Cairo, ST=Cairo, C=EG"
            printf 'storePassword=baytbeam-ci-only\nkeyPassword=baytbeam-ci-only\nkeyAlias=baytbeam\nstoreFile=../baytbeam-release.jks\n' > key.properties
            echo "WARNING: BAYTBEAM Android secrets are not configured; this build uses a disposable CI key."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get

      - name: Build split APKs
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          mkdir -p release-assets
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-assets/BaytBeam-${{ env.RELEASE_TAG }}-android-armeabi-v7a.apk
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/BaytBeam-${{ env.RELEASE_TAG }}-android-arm64.apk
          cp app/build/app/outputs/flutter-apk/app-x86_64-release.apk release-assets/BaytBeam-${{ env.RELEASE_TAG }}-android-x86_64.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baytbeam-android-full
          path: release-assets/*.apk
          if-no-files-found: error

  build_linux_x64:
    name: Build Linux x64 packages
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libfuse2 libmpv-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Linux bundle
        working-directory: app
        run: flutter build linux --release

      - name: Create Linux tarball
        run: |
          mkdir -p release-assets
          tar -czf release-assets/BaytBeam-${{ env.RELEASE_TAG }}-linux-x64.tar.gz -C app/build/linux/x64/release/bundle .

      - name: Build Debian package
        run: |
          dart pub global activate flutter_distributor
          (cd app && PATH="$HOME/.pub-cache/bin:$PATH" flutter_distributor package --platform linux --targets deb)
          deb_path=$(find app/dist -type f -name '*.deb' -print -quit)
          test -n "$deb_path"
          cp "$deb_path" release-assets/BaytBeam-${{ env.RELEASE_TAG }}-linux-x64.deb

      - name: Prepare AppImage
        run: |
          mkdir -p AppDir
          cp -r app/build/linux/x64/release/bundle/. AppDir/
          mkdir -p AppDir/usr/share/icons/hicolor/32x32/apps AppDir/usr/share/icons/hicolor/128x128/apps AppDir/usr/share/icons/hicolor/256x256/apps
          cp app/assets/img/logo-32.png AppDir/usr/share/icons/hicolor/32x32/apps/localsend.png
          cp app/assets/img/logo-128.png AppDir/usr/share/icons/hicolor/128x128/apps/localsend.png
          cp app/assets/img/logo-256.png AppDir/usr/share/icons/hicolor/256x256/apps/localsend.png
          cp support/build/appimage/AppImageBuilder_x86_64.yml AppImageBuilder.yml

      - name: Build AppImage
        uses: AppImageCrafters/build-appimage@57c3bc6963f870ce3be103117de5b5e33ffbaeb6
        with:
          recipe: ./AppImageBuilder.yml

      - name: Rename AppImage
        run: |
          appimage=$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          cp "$appimage" release-assets/BaytBeam-${{ env.RELEASE_TAG }}-linux-x64.AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baytbeam-linux-x64
          path: release-assets/*
          if-no-files-found: error

  build_linux_arm64:
    name: Build Linux arm64 packages
    needs: verify
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libmpv-dev

      - name: Set up Flutter SDK
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Linux bundle
        working-directory: app
        run: flutter build linux --release

      - name: Create Linux arm64 tarball
        run: |
          mkdir -p release-assets
          tar -czf release-assets/BaytBeam-${{ env.RELEASE_TAG }}-linux-arm64.tar.gz -C app/build/linux/arm64/release/bundle .

      - name: Build Debian arm64 package
        run: |
          dart pub global activate flutter_distributor
          (cd app && PATH="$HOME/.pub-cache/bin:$PATH" flutter_distributor package --platform linux --targets deb)
          deb_path=$(find app/dist -type f -name '*.deb' -print -quit)
          test -n "$deb_path"
          cp "$deb_path" release-assets/BaytBeam-${{ env.RELEASE_TAG }}-linux-arm64.deb

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baytbeam-linux-arm64
          path: release-assets/*
          if-no-files-found: error

  build_windows:
    name: Build Windows x64 packages
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get

      - name: Build MSIX helper required by Windows install
        shell: pwsh
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\baytbeam_msix_helper.msix

      - name: Sign BaytBeam MSIX helper when configured
        shell: pwsh
        env:
          BAYTBEAM_WINDOWS_PFX_BASE64: ${{ secrets.BAYTBEAM_WINDOWS_PFX_BASE64 }}
          BAYTBEAM_WINDOWS_PFX_PASSWORD: ${{ secrets.BAYTBEAM_WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BAYTBEAM_WINDOWS_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:BAYTBEAM_WINDOWS_PFX_PASSWORD)) {
            Write-Host "MSIX helper remains unsigned because BaytBeam Windows signing secrets are not configured."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "baytbeam-code-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:BAYTBEAM_WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe was not found" }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:BAYTBEAM_WINDOWS_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "app/windows/baytbeam_msix_helper.msix"
          Write-Host "Signed BaytBeam MSIX helper with the maintainer certificate."

      - name: Patch media_kit CMake extraction
        shell: pwsh
        run: |
          $cmake = "app/windows/flutter/ephemeral/.plugin_symlinks/media_kit_libs_windows_video/windows/CMakeLists.txt"
          if (Test-Path $cmake) {
            $content = Get-Content -Raw $cmake
            $nl = [Environment]::NewLine
            if ($content -notmatch "CMP0175") {
              $policy = "cmake_policy(SET CMP0175 OLD)" + $nl
              if ($content -match "(?m)^cmake_minimum_required\([^\r\n]+\)") {
                $content = [regex]::Replace($content, "(?m)^(cmake_minimum_required\([^\r\n]+\))", ('$1' + $nl + $policy), 1)
              } else {
                $content = $policy + $content
              }
            }
            $libmpvReplacement = @(
              '  file(ARCHIVE_EXTRACT INPUT "${LIBMPV_ARCHIVE}" DESTINATION "${LIBMPV_SRC}")',
              '  file(COPY "${LIBMPV_SRC}/include/mpv" DESTINATION "${LIBMPV_SRC}")',
              '  file(REMOVE_RECURSE "${LIBMPV_SRC}/include")',
              '  file(RENAME "${LIBMPV_SRC}/mpv" "${LIBMPV_SRC}/include")',
              'endif()'
            ) -join $nl
            $content = [regex]::Replace($content, '(?ms)  add_custom_target\("\$\{PROJECT_NAME\}_LIBMPV_EXTRACT" ALL\).*?  \)\r?\nendif\(\)', $libmpvReplacement, 1)
            $angleReplacement = @(
              '  file(ARCHIVE_EXTRACT INPUT "${ANGLE_ARCHIVE}" DESTINATION "${ANGLE_SRC}")',
              'endif()'
            ) -join $nl
            $content = [regex]::Replace($content, '(?ms)  add_custom_target\("\$\{PROJECT_NAME\}_ANGLE_EXTRACT" ALL\).*?  \)\r?\nendif\(\)', $angleReplacement, 1)
            Set-Content -Path $cmake -Value $content -NoNewline
          }

      - name: Build Windows
        working-directory: app
        run: flutter build windows --release

      - name: Sign BaytBeam Windows executable when configured
        shell: pwsh
        env:
          BAYTBEAM_WINDOWS_PFX_BASE64: ${{ secrets.BAYTBEAM_WINDOWS_PFX_BASE64 }}
          BAYTBEAM_WINDOWS_PFX_PASSWORD: ${{ secrets.BAYTBEAM_WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BAYTBEAM_WINDOWS_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:BAYTBEAM_WINDOWS_PFX_PASSWORD)) {
            Write-Host "WARNING: Windows signing secrets are not configured; the executable and installer will remain unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "baytbeam-code-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:BAYTBEAM_WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe was not found" }
          $bundle = "app/build/windows/x64/runner/Release"
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:BAYTBEAM_WINDOWS_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "$bundle\baytbeam_app.exe"
          Write-Host "Signed BaytBeam executable with the maintainer certificate."

      - name: Create Windows portable ZIP and installer EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $bundle = "app/build/windows/x64/runner/Release"
          Compress-Archive -Path "$bundle/*" -DestinationPath "release-assets/BaytBeam-${{ env.RELEASE_TAG }}-windows-x64-portable.zip" -Force
          $payload = Join-Path $env:RUNNER_TEMP "localsend-inno"
          $result = Join-Path $env:RUNNER_TEMP "localsend-inno-result"
          New-Item -ItemType Directory -Force -Path $payload, $result | Out-Null
          Copy-Item -Path "$bundle/*" -Destination $payload -Recurse
          Copy-Item -Path "app/assets/packaging/logo.ico" -Destination $payload
          Copy-Item -Path "support/build/windows/x64/*" -Destination $payload -Recurse
          iscc /DSkipSignTool "/DPayloadDir=$payload" "/DResultDir=$result" support/scripts/compile_windows_exe-inno.iss
          Copy-Item -Path "$result/baytbeam-setup.exe" -Destination "release-assets/BaytBeam-${{ env.RELEASE_TAG }}-windows-x64.exe"

      - name: Sign BaytBeam installer when configured
        shell: pwsh
        env:
          BAYTBEAM_WINDOWS_PFX_BASE64: ${{ secrets.BAYTBEAM_WINDOWS_PFX_BASE64 }}
          BAYTBEAM_WINDOWS_PFX_PASSWORD: ${{ secrets.BAYTBEAM_WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BAYTBEAM_WINDOWS_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:BAYTBEAM_WINDOWS_PFX_PASSWORD)) {
            Write-Host "Windows installer remains unsigned because BAYTBEAM Windows signing secrets are not configured."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "baytbeam-code-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:BAYTBEAM_WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe was not found" }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:BAYTBEAM_WINDOWS_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "release-assets/BaytBeam-${{ env.RELEASE_TAG }}-windows-x64.exe"
          Write-Host "Signed BaytBeam installer with the maintainer certificate."

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baytbeam-windows-full
          path: release-assets/*
          if-no-files-found: error

  build_macos:
    name: Build macOS app
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get

      - name: Configure unsigned macOS build for CI
        run: |
          project=app/macos/Runner.xcodeproj/project.pbxproj
          sed -i '' -E 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g; s/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g; s/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "[^"]*";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "";/g; s/CODE_SIGN_STYLE = [^;]*;/CODE_SIGN_STYLE = Manual;/g' "$project"
          grep -n -E 'CODE_SIGN|DEVELOPMENT_TEAM' "$project" | head -60

      - name: Build macOS
        working-directory: app
        run: flutter build macos --release
        env:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""

      - name: Archive macOS app
        run: |
          mkdir -p release-assets
          app=$(find app/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" release-assets/BaytBeam-${{ env.RELEASE_TAG }}-macos-unsigned.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: baytbeam-macos
          path: release-assets/*.zip
          if-no-files-found: error

  build_ios:
    name: Build iOS unsigned archive
    needs: verify
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get

      - name: Build iOS without code signing
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Archive unsigned iOS app
        run: |
          mkdir -p release-assets
          test -d app/build/ios/iphoneos/Runner.app
          ditto -c -k --sequesterRsrc --keepParent app/build/ios/iphoneos/Runner.app release-assets/BaytBeam-${{ env.RELEASE_TAG }}-ios-unsigned.app.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: baytbeam-ios
          path: release-assets/*.zip
          if-no-files-found: error

  release:
    name: Create full platform GitHub Release
    needs: [verify, build_android, build_linux_x64, build_linux_arm64, build_windows, build_macos, build_ios]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source metadata
        uses: actions/checkout@v4

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: baytbeam-android-full
          path: release-assets

      - name: Download Linux x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: baytbeam-linux-x64
          path: release-assets

      - name: Download Linux arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: baytbeam-linux-arm64
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: baytbeam-windows-full
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: baytbeam-macos
          path: release-assets

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: baytbeam-ios
          path: release-assets

      - name: Add public BaytBeam Windows certificate
        run: cp support/signing/baytbeam-code-signing.cer release-assets/baytbeam-code-signing.cer

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # BaytBeam Home Hub v1.18.2-baytbeam.1

          This release is an independent BaytBeam build based on the LocalSend fork and keeps the original LocalSend send, receive, discovery, Stream & Browse, and settings flows intact. Home Hub adds local group models and persistence, direct LAN/mTLS invitations, explicit accept/decline membership, viewer/sender/guest roles, guest expiry validation, local chat with an outbox and per-recipient delivery status, activity history, Revoke All, and group broadcast UI that reuses the original LocalSend v2 transfer machinery for each recipient independently.

          Home Hub control-plane requests use the discovered peer IP and LocalSend port directly. Rust validates the TLS certificate fingerprint, UUIDs, timestamps, role/expiry, group allow-list, message limits, and individual transfer-offer decisions before forwarding events to Flutter. No Home Hub message, metadata, or file body is sent to a cloud endpoint. The original optional WebRTC signaling path remains separate and disabled by default; Wi-Fi voice calls are not enabled in this release.

          Broadcast transfers are never forced by a group owner: each device receives its own LocalSend approval request and can accept or reject independently. Offline chat deliveries remain in the sender's local outbox; there is no always-on central server and no promise of delivery while a peer is powered off. The local transfer flow supports the existing LocalSend resume/retry behavior, while Home Hub voice signaling and a richer cross-device activity synchronization layer remain future work.

          The Android artifacts are split per ABI. Linux includes x64 tar.gz, Debian, AppImage, and arm64 tar.gz/Debian packages. Windows includes x64 portable ZIP and installer EXE. macOS is provided as an unsigned app archive. iOS is provided as an unsigned `.app` archive because an App Store/TestFlight/device-installable IPA requires the owner's Apple signing certificates and provisioning profile.

          Android APKs use the maintainer-controlled BaytBeam keystore when the BAYTBEAM_ANDROID_* repository secrets are configured; otherwise CI uses a clearly labelled disposable key that cannot update a previous maintainer-signed installation. Windows executable, MSIX helper, and installer signing use the maintainer PFX when BAYTBEAM_WINDOWS_* secrets are configured; the public certificate is included as baytbeam-code-signing.cer. macOS and iOS remain unsigned without Apple credentials. GitHub Actions run Rust tests for Home Hub mTLS identity, unauthorized group events, guest expiry, independent transfer approval, Stream & Browse approval gates, traversal protection, Range streaming, empty files, and revoke before packaging.
          EOF

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BaytBeam Home Hub ${{ env.RELEASE_TAG }}" \
            --notes-file RELEASE_NOTES.md \
            release-assets/*
