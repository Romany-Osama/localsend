name: Stream & Browse Full Platform Release

on: [workflow_dispatch]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"
  RELEASE_TAG: v1.18.2-stream.9

jobs:
  verify:
    name: Verify Stream & Browse core
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting of changed Rust files
        run: |
          rustfmt --edition 2021 --check packages/core/src/http/server/stream.rs
          rustfmt --edition 2021 --check packages/core/tests/stream_browse.rs

      - name: Run Stream & Browse integration tests
        run: cargo test --manifest-path packages/core/Cargo.toml --features http --test stream_browse -- --nocapture

      - name: Run Stream & Browse unit tests
        run: cargo test --manifest-path packages/core/Cargo.toml --features http --lib stream -- --nocapture

      - name: Check core HTTP build
        run: cargo check --manifest-path packages/core/Cargo.toml --features http

  build_android:
    name: Build Android APKs
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create temporary release keystore
        working-directory: app/android
        run: |
          keytool -genkeypair -v -keystore stream-browse-release.jks -storepass android -alias stream-browse -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LocalSend Stream Browse, OU=Open Source, O=LocalSend, L=Unknown, S=Unknown, C=US"
          printf 'storePassword=android\nkeyPassword=android\nkeyAlias=stream-browse\nstoreFile=../stream-browse-release.jks\n' > key.properties

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get

      - name: Build split APKs
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          mkdir -p release-assets
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-assets/LocalSend-${{ env.RELEASE_TAG }}-android-armeabi-v7a.apk
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/LocalSend-${{ env.RELEASE_TAG }}-android-arm64.apk
          cp app/build/app/outputs/flutter-apk/app-x86_64-release.apk release-assets/LocalSend-${{ env.RELEASE_TAG }}-android-x86_64.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stream-browse-android-full
          path: release-assets/*.apk
          if-no-files-found: error

  build_linux_x64:
    name: Build Linux x64 packages
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libfuse2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Linux bundle
        working-directory: app
        run: flutter build linux --release

      - name: Create Linux tarball
        run: |
          mkdir -p release-assets
          tar -czf release-assets/LocalSend-${{ env.RELEASE_TAG }}-linux-x64.tar.gz -C app/build/linux/x64/release/bundle .

      - name: Build Debian package
        run: |
          dart pub global activate flutter_distributor
          PATH="$HOME/.pub-cache/bin:$PATH" flutter_distributor package --platform linux --targets deb --working-directory app
          deb_path=$(find app/dist -type f -name '*.deb' -print -quit)
          test -n "$deb_path"
          cp "$deb_path" release-assets/LocalSend-${{ env.RELEASE_TAG }}-linux-x64.deb

      - name: Prepare AppImage
        run: |
          mkdir -p AppDir
          cp -r app/build/linux/x64/release/bundle/. AppDir/
          mkdir -p AppDir/usr/share/icons/hicolor/32x32/apps AppDir/usr/share/icons/hicolor/128x128/apps AppDir/usr/share/icons/hicolor/256x256/apps
          cp app/assets/img/logo-32.png AppDir/usr/share/icons/hicolor/32x32/apps/localsend.png
          cp app/assets/img/logo-128.png AppDir/usr/share/icons/hicolor/128x128/apps/localsend.png
          cp app/assets/img/logo-256.png AppDir/usr/share/icons/hicolor/256x256/apps/localsend.png
          cp support/build/appimage/AppImageBuilder_x86_64.yml AppImageBuilder.yml

      - name: Build AppImage
        uses: AppImageCrafters/build-appimage@57c3bc6963f870ce3be103117de5b5e33ffbaeb6
        with:
          recipe: ./AppImageBuilder.yml

      - name: Rename AppImage
        run: |
          appimage=$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          cp "$appimage" release-assets/LocalSend-${{ env.RELEASE_TAG }}-linux-x64.AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stream-browse-linux-x64
          path: release-assets/*
          if-no-files-found: error

  build_linux_arm64:
    name: Build Linux arm64 packages
    needs: verify
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev

      - name: Set up Flutter SDK
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Linux bundle
        working-directory: app
        run: flutter build linux --release

      - name: Create Linux arm64 tarball
        run: |
          mkdir -p release-assets
          tar -czf release-assets/LocalSend-${{ env.RELEASE_TAG }}-linux-arm64.tar.gz -C app/build/linux/arm64/release/bundle .

      - name: Build Debian arm64 package
        run: |
          dart pub global activate flutter_distributor
          PATH="$HOME/.pub-cache/bin:$PATH" flutter_distributor package --platform linux --targets deb --working-directory app
          deb_path=$(find app/dist -type f -name '*.deb' -print -quit)
          test -n "$deb_path"
          cp "$deb_path" release-assets/LocalSend-${{ env.RELEASE_TAG }}-linux-arm64.deb

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stream-browse-linux-arm64
          path: release-assets/*
          if-no-files-found: error

  build_windows:
    name: Build Windows x64 packages
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get

      - name: Build MSIX helper required by Windows install
        shell: pwsh
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\localsend_msix_helper.msix

      - name: Patch media_kit CMake extraction
        shell: pwsh
        run: |
          $cmake = "app/windows/flutter/ephemeral/.plugin_symlinks/media_kit_libs_windows_video/windows/CMakeLists.txt"
          if (Test-Path $cmake) {
            $content = Get-Content -Raw $cmake
            $nl = [Environment]::NewLine
            if ($content -notmatch "CMP0175") {
              $policy = "cmake_policy(SET CMP0175 OLD)" + $nl
              if ($content -match "(?m)^cmake_minimum_required\([^\r\n]+\)") {
                $content = [regex]::Replace($content, "(?m)^(cmake_minimum_required\([^\r\n]+\))", ('$1' + $nl + $policy), 1)
              } else {
                $content = $policy + $content
              }
            }
            $libmpvReplacement = @(
              '  file(ARCHIVE_EXTRACT INPUT "${LIBMPV_ARCHIVE}" DESTINATION "${LIBMPV_SRC}")',
              '  file(COPY "${LIBMPV_SRC}/include/mpv" DESTINATION "${LIBMPV_SRC}")',
              '  file(REMOVE_RECURSE "${LIBMPV_SRC}/include")',
              '  file(RENAME "${LIBMPV_SRC}/mpv" "${LIBMPV_SRC}/include")',
              'endif()'
            ) -join $nl
            $content = [regex]::Replace($content, '(?ms)  add_custom_target\("\$\{PROJECT_NAME\}_LIBMPV_EXTRACT" ALL\).*?  \)\r?\nendif\(\)', $libmpvReplacement, 1)
            $angleReplacement = @(
              '  file(ARCHIVE_EXTRACT INPUT "${ANGLE_ARCHIVE}" DESTINATION "${ANGLE_SRC}")',
              'endif()'
            ) -join $nl
            $content = [regex]::Replace($content, '(?ms)  add_custom_target\("\$\{PROJECT_NAME\}_ANGLE_EXTRACT" ALL\).*?  \)\r?\nendif\(\)', $angleReplacement, 1)
            Set-Content -Path $cmake -Value $content -NoNewline
          }

      - name: Build Windows
        working-directory: app
        run: flutter build windows --release

      - name: Create Windows portable ZIP and installer EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $bundle = "app/build/windows/x64/runner/Release"
          Compress-Archive -Path "$bundle/*" -DestinationPath "release-assets/LocalSend-${{ env.RELEASE_TAG }}-windows-x64-portable.zip" -Force
          $payload = Join-Path $env:RUNNER_TEMP "localsend-inno"
          $result = Join-Path $env:RUNNER_TEMP "localsend-inno-result"
          New-Item -ItemType Directory -Force -Path $payload, $result | Out-Null
          Copy-Item -Path "$bundle/*" -Destination $payload -Recurse
          Copy-Item -Path "app/assets/packaging/logo.ico" -Destination $payload
          Copy-Item -Path "support/build/windows/x64/*" -Destination $payload -Recurse
          iscc /DSkipSignTool "/DPayloadDir=$payload" "/DResultDir=$result" support/scripts/compile_windows_exe-inno.iss
          Copy-Item -Path "$result/localsend.exe" -Destination "release-assets/LocalSend-${{ env.RELEASE_TAG }}-windows-x64.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stream-browse-windows-full
          path: release-assets/*
          if-no-files-found: error

  build_macos:
    name: Build macOS app
    needs: verify
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get

      - name: Build macOS
        working-directory: app
        run: flutter build macos --release

      - name: Archive macOS app
        run: |
          mkdir -p release-assets
          app=$(find app/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" release-assets/LocalSend-${{ env.RELEASE_TAG }}-macos-unsigned.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: stream-browse-macos
          path: release-assets/*.zip
          if-no-files-found: error

  build_ios:
    name: Build iOS unsigned archive
    needs: verify
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get

      - name: Build iOS without code signing
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Archive unsigned iOS app
        run: |
          mkdir -p release-assets
          test -d app/build/ios/iphoneos/Runner.app
          ditto -c -k --sequesterRsrc --keepParent app/build/ios/iphoneos/Runner.app release-assets/LocalSend-${{ env.RELEASE_TAG }}-ios-unsigned.app.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: stream-browse-ios
          path: release-assets/*.zip
          if-no-files-found: error

  release:
    name: Create full platform GitHub Release
    needs: [verify, build_android, build_linux_x64, build_linux_arm64, build_windows, build_macos, build_ios]
    runs-on: ubuntu-22.04
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: stream-browse-android-full
          path: release-assets

      - name: Download Linux x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: stream-browse-linux-x64
          path: release-assets

      - name: Download Linux arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: stream-browse-linux-arm64
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: stream-browse-windows-full
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: stream-browse-macos
          path: release-assets

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: stream-browse-ios
          path: release-assets

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # LocalSend Stream & Browse v1.18.2-stream.9

          This release is built from the LocalSend fork's `stream-browse` branch. The original LocalSend transfer features remain available, and Stream & Browse adds LAN HTTP browsing, approval for every session, approval for every file request, temporary read-only grants, HTTP Range streaming, and in-app playback without saving the streamed file on the requesting device.

          All Stream & Browse data requests use the source device's discovered local IP and LocalSend HTTP port. The feature does not upload files to a cloud service or download them from the internet. The existing optional WebRTC signaling path is separate and remains disabled by default.

          The Android artifacts are split per ABI. Linux includes x64 tar.gz, Debian, AppImage, and arm64 tar.gz/Debian packages. Windows includes x64 portable ZIP and installer EXE. macOS is provided as an unsigned app archive. iOS is provided as an unsigned `.app` archive because an App Store/TestFlight/device-installable IPA requires the owner's Apple signing certificates and provisioning profile.

          The Android APKs use a temporary CI test key for evaluation. Windows and macOS artifacts are unsigned. GitHub Actions run the Rust integration tests for approval gating, traversal protection, Range streaming, empty files, and revoke before packaging.
          EOF

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "LocalSend Stream & Browse ${{ env.RELEASE_TAG }}" \
            --notes-file RELEASE_NOTES.md \
            release-assets/*
